[project]
name = "bilangsim"
version = "0.2.0"
description = "Agent-based simulator of bilingual societies"
authors = [{ name = "Paolo Gervasoni Vila", email = "pgervila@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "numba>=0.60",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "networkx>=3.3",
    "pyarrow>=17.0",
    "dill>=0.3.8",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-repeat>=0.9",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bilangsim"]
